<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#170d2c"><title>SUS — Bluffing Party Game</title><link rel="stylesheet" href="/styles.css"><script src="/socket.io/socket.io.js"></script></head><body><main class="wrap"><header><div class="logo">SUS</div><span class="tag">THE BLUFFING PARTY GAME</span></header><section id="app" class="panel"><h1>Trust nobody.</h1><p>Tell a convincing lie. Spot the truth. Catch the Decoy.</p><div class="actions"><button id="create">Create host room</button><button class="secondary" id="showJoin">Join with a code</button></div><form id="join" class="hidden"><input id="code" placeholder="4-letter room code" maxlength="4" required><input id="name" placeholder="Your player name" maxlength="18" required><button>Join game</button></form><p id="msg" role="status"></p></section></main><script src="/app.js"></script></body></html>
